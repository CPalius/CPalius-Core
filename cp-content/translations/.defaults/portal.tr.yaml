core:
  label: "Bölüm 2"
  title: "\"Core Never Dies\" — Çökmeyen Çekirdek Mimarisi"
  desc: "Kullanıcı alanından gelebilecek kötü yazılmış veya bozuk kodların tüm sistemi kilitlemesini engelleyen Dört Kademeli Aktif Savunma ve Karantina Hattı."
  line1_label: "1. Savunma Hattı"
  line1_title: "Tavuk-Yumurta Probleminin Çözümü"
  line1_p1_html: "Symfony boot edilirken <strong>config/bundles.php</strong> dosyası okunur. Bu aşamada henüz veritabanı bağlantısı, servis konteyneri veya autoloader tam olarak ayağa kalkmamıştır. Modüllerin aktiflik durumunu doğrudan veritabanından okumaya çalışırsak, sistem daha boot edilemeden kilitlenir."
  line1_p2_html: "<strong>Çözüm:</strong> CPalius, bir modül aktif/pasif edildiğinde <code>active_modules.php</code> adında statik, PHP opcache dostu bir dizi dosyası üretir. <code>bundles.php</code> sadece bu dosyayı okur — veritabanına hiç dokunmaz."
  code_file: "cp-core/config/bundles.php"
  code_comment_core: "// Çekirdek her zaman ayakta"
  code_comment_modules: "// Aktif modülleri dosyadan oku"
  line2_label: "2. Savunma Hattı"
  line2_title: "Çalışma Zamanı İzolasyonu"
  line2_p1_html: "Sınıfın fiziksel olarak var olması (<code>class_exists</code>), o modülün kodunun hatasız çalıştığı anlamına gelmez. Modülün <code>boot()</code> metodu içinde fırlatacağı bir <strong>TypeError</strong> veya <strong>RuntimeException</strong> tüm sistemi çökertebilir."
  line2_p2_html: "<strong>Çözüm:</strong> <code>Kernel::boot()</code> metodu override edilerek modül seviyesindeki tüm boot süreçleri <code>try/catch (\\Throwable)</code> zırhıyla kuşatıldı. Hatalı modül otomatik karantinaya alınır, çekirdek çalışmaya devam eder."
  line3_label: "3. Savunma Hattı"
  line3_title: "Compile-Time Kilitlenme Koruması & Dry-Run"
  line3_p1: "Eklentideki geçersiz bir YAML sözdizimi veya yanlış bir DI tanımı, Symfony container'ı derlenemez hale getirir. Bu durumda terminalde komut bile çalıştırılamaz."
  line3_p2_html: "<strong>Çözüm:</strong> Modül aktive edilmeden önce <code>symfony/process</code> ile izole bir alt süreç başlatılır. Bu süreçte <code>cache:clear</code> → <code>lint:yaml</code> → <code>lint:container</code> komutları koşturulur. Hata varsa aktivasyon iptal edilir ve modül kalıcı olarak karantinaya alınır. Dosya asla bozuk haliyle kaydedilmez."
  line4_label: "Yeni — 4. Savunma Hattı"
  line4_title: "İzole Route Yükleyicisi"
  line4_p1_html: "Standart Symfony'de bir modülün <code>routes.yaml</code> dosyasındaki syntax hatası tüm sistemi çökertir."
  line4_p2_html: "<strong>Çözüm:</strong> <code>SafeModuleRouteLoader</code> her modülün rotasını izole bir try/catch bloğunda yükler. Hatalı modül atlanır ancak sistemin geri kalanı %100 ayakta kalır."
  line4_code_header: "cp-core/src/Core/Routing/SafeModuleRouteLoader.php"
  line4_code: |
    foreach ($this->moduleRegistry->getHealthyModuleBundles() as $moduleClass) {
        try {
            $imported = $this->import($routesFile, 'yaml');
            $collection->addCollection($imported);
        } catch (\Throwable $e) {
            // One broken routes.yaml never takes down the kernel.
            $this->logger?->error('Skipping broken module routes', [
                'module' => $moduleClass,
                'error' => $e->getMessage(),
            ]);
        }
    }

features:
  label: "Öne çıkanlar"
  title: "Kurumsal omurganın altı ayağı"
  desc: "Landing'de yalnızca karar vermenizi sağlayan başlıklar var. Mimari derinliği, kod örnekleri ve son sprintlerin tamamı Whitepaper'da."
  core_title: "Çökmeyen Çekirdek"
  core_text: "Bozuk bir modül sistemi kilitlemez. Dört kademeli savunma, karantina ve Safe Mode — çekirdek her zaman ayakta kalır."
  hybrid_title: "Hibrit Veri Modeli"
  hybrid_text: "Sık sorgulanan alanlar gerçek sütunlarda; esnek içerik tek JSON kolonunda. EAV JOIN cehennemi ve WordPress meta karmaşası yok."
  i18n_title: "Çok Dilli Çekirdek"
  i18n_text: "Dil sonradan eklenen bir cila değil. Kompozit UNIQUE(slug, locale) ve translation_group_id ile kardeş kayıtlar ilk günden çekirdekte."
  origin_title: "Origin Cache & Performans"
  origin_text: "Statik HTML origin cache, Redis, Memcached, Varnish, PageSpeed ve OPcache — AACP dashboard'unda adet ve boyut özeti."
  ops_title: "AACP Komuta Masası"
  ops_text: "Canlı sistem sağlığı, Studio dashboard, güvenlik telemetrisi ve IP ban. Veritabanı düşse bile Recovery Console ayakta kalır."
  extend_title: "Modül, API, Hook, Cron"
  extend_text: "REST Gateway, izole hook'lar, birleşik cron ve ilk parti Blog/Forum/Medya/Menü/SEO — hepsi aynı Capability zırhıyla."
  more_hint: "Config Sync, XSS sanitization, Schema.org, N+1 muhafızı, audit log ve forum motorunun ayrıntısı Whitepaper'da."
  more_cta: "Tüm teknik ayrıntılar — Whitepaper"
  index_title: "Flat Field Index Motoru"
  index_text: "JSON verilerini veritabanı bağımsız sorgulayın. NodeFieldIndex tablosu ve Doctrine Event Listener ile tip-uygun kolonlara sahip indeks tablosu. SQLite, MySQL ve Postgres'te aynı DQL çalışır."
  config_title: "Config Sync Sistemi"
  config_text: "Drupal'ın config sync yaklaşımı, Symfony TreeBuilder ile birleştirildi. Roller ve yetenek matrisleri YAML dosyalarında tutulur, Git ile taşınır. Kullanıcı verileri ise veritabanında kalır."
  bundle_title: "Modüler Bundle Mimarisi"
  bundle_text: "Her modül bağımsız bir Symfony Bundle olarak çalışır. Kendi routes, services, templates ve migrations dosyalarına sahiptir. Modules\\ namespace'i ile tam izolasyon."
  zero_title: "Zero Node.js Politikası"
  zero_text: "Geliştirici ve admin panelinde AssetMapper + Standalone Tailwind CSS kullanılır. Node.js bağımlılığı sıfır. Derleme adımı yok, doğrudan geliştirme — doğrudan deploy."
  xss_title: "Core-Level XSS Sanitization"
  xss_text_html: "Manifesto Law 5.3 gereği, <code>RichTextSanitizer</code> ile veritabanına kaydedilecek her zengin metin çekirdek seviyesinde sterilize edilir."
  seo_title: "Dinamik Semantic SEO"
  seo_text_html: "Hibrit JSON tabanlı verilerden <code>SchemaOrgBuilder</code> aracılığıyla otomatik olarak JSON-LD (Schema.org) üretimi (BlogPosting, WebPage)."
  event_title: "Otonom Event-Driven Topoloji"
  event_text: "YAGNI prensibini çiğnemeden inşa edilen, asenkron ve decoupling odaklı reaktif haberleşme omurgası. Katmanlar arası bağımlılıklar ve hook tetikleyicileri (event subscribers), \"Golden Ratio\" hassasiyetinde orantılanarak minimize edilmiştir."


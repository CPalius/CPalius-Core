  tree_modules: "# Independent modules"
  tree_themes: "# UI themes"
  tree_translations: "# Translations (tr, en)"
  tree_web: "# WEB ROOT"
  tree_index: "# Front Controller"
  tree_assets: "# Frontend assets"
  card_core_title: "Kernel & System Space"
  card_core_text: "Core PHP classes, configuration, console tools, and database migrations. Symfony Flex recipes are guaranteed to install directly here."
  card_includes_title: "Dependencies Space"
  card_includes_html: "Composer packages and Symfony libraries live in this isolated space. The <code>vendor-dir</code> has been reconfigured."
  card_content_title: "User & Developer Space"
  card_content_text: "Modules, themes, translations, and Config Sync live here. Developer code never mixes with framework system files."
  card_public_title: "Web Root"
  card_public_text: "The only public folder. The Front Controller (index.php) and compiled frontend assets live here. This is the security boundary."

core:
  label: "Chapter 2"
  title: "\"Core Never Dies\" — An Unbreakable Core Architecture"
  desc: "A four-layer active defense and quarantine line that prevents bad or broken user code from locking down the entire system."
  line1_label: "Defense Line 1"
  line1_title: "Solving the Chicken-and-Egg Problem"
  line1_p1_html: "When Symfony boots, it reads <strong>config/bundles.php</strong>. At this stage the database connection, service container, and autoloader are not fully ready. Trying to read module status from the database would lock the system before it can boot."
  line1_p2_html: "<strong>Solution:</strong> When a module is activated or deactivated, CPalius generates a static, PHP opcache-friendly array file named <code>active_modules.php</code>. <code>bundles.php</code> only reads that file — it never touches the database."
  code_file: "cp-core/config/bundles.php"
  code_comment_core: "// Core always stays up"
  code_comment_modules: "// Load active modules from file"
  line2_label: "Defense Line 2"
  line2_title: "Runtime Isolation"
  line2_p1_html: "A class existing on disk (<code>class_exists</code>) does not mean its code runs safely. A <strong>TypeError</strong> or <strong>RuntimeException</strong> thrown inside a module's <code>boot()</code> method can crash the entire system."
  line2_p2_html: "<strong>Solution:</strong> <code>Kernel::boot()</code> is overridden so every module-level boot process is wrapped in <code>try/catch (\\Throwable)</code>. Faulty modules are quarantined automatically while the core keeps running."
  line3_label: "Defense Line 3"
  line3_title: "Compile-Time Lock Protection & Dry-Run"
  line3_p1: "Invalid YAML syntax or a bad DI definition in a plugin can make the Symfony container uncompilable. In that state, even terminal commands fail."
  line3_p2_html: "<strong>Solution:</strong> Before activation, an isolated subprocess is started with <code>symfony/process</code>. It runs <code>cache:clear</code> → <code>lint:yaml</code> → <code>lint:container</code>. On failure, activation is cancelled and the module is permanently quarantined. Broken state is never written to disk."
  line4_label: "New — Defense Line 4"
  line4_title: "Isolated Route Loader"
  line4_p1_html: "In standard Symfony, a syntax error in a module's <code>routes.yaml</code> file crashes the entire system."
  line4_p2_html: "<strong>Solution:</strong> <code>SafeModuleRouteLoader</code> loads each module's routes inside an isolated try/catch block. The faulty module is skipped while the rest of the system stays 100% available."
  line4_code_header: "cp-core/src/Core/Routing/SafeModuleRouteLoader.php"
  line4_code: |
    foreach ($this->moduleRegistry->getHealthyModuleBundles() as $moduleClass) {
        try {
            $imported = $this->import($routesFile, 'yaml');
            $collection->addCollection($imported);
        } catch (\Throwable $e) {
            $this->logger?->error('Skipping broken module routes', [
                'module' => $moduleClass,
                'error' => $e->getMessage(),
            ]);
        }
    }

features:
  label: "Highlights"
  title: "Six pillars of the enterprise backbone"
  desc: "The landing page shows only the decisions that matter. Architecture depth, code samples, and every shipped sprint live in the Whitepaper."
  core_title: "Core Never Dies"
  core_text: "A broken module cannot lock the system. Four defense lines, quarantine, and Safe Mode keep the kernel running."
  hybrid_title: "Hybrid Data Model"
  hybrid_text: "Hot fields live in real columns; flexible content lives in one JSON column. No EAV JOIN hell and no WordPress meta chaos."
  i18n_title: "Localization in the Core"
  i18n_text: "Language is not a late polish layer. Composite UNIQUE(slug, locale) and translation_group_id sibling rows are baked in from day one."
  origin_title: "Origin Cache & Performance"
  origin_text: "Static HTML origin cache plus Redis, Memcached, Varnish, PageSpeed, and OPcache — counts and sizes on the AACP dashboard."
  ops_title: "AACP Command Desk"
  ops_text: "Live system health, Studio dashboard, security telemetry, and IP bans. The Recovery Console stays up even if the database is down."
  extend_title: "Modules, API, Hooks, Cron"
  extend_text: "REST Gateway, isolated hooks, a unified cron engine, and first-party Blog/Forum/Media/Menu/SEO — all under the same capability armor."
  index_title: "Flat Field Index Engine"
  index_text: "Query JSON data in a database-agnostic way. NodeFieldIndex plus a Doctrine Event Listener build a typed index table. The same DQL works on SQLite, MySQL, and Postgres."
  config_title: "Config Sync System"
  config_text: "Drupal's config sync approach, combined with Symfony TreeBuilder. Roles and capability matrices live in YAML and travel with Git. User data stays in the database."
  bundle_title: "Modular Bundle Architecture"
  bundle_text: "Every module runs as an independent Symfony Bundle with its own routes, services, templates, and migrations. Full isolation under the Modules\\ namespace."
  zero_title: "Zero Node.js Policy"
  zero_text: "Developer and admin panels use AssetMapper + Standalone Tailwind CSS. Zero Node.js dependency. No build step — develop and deploy directly."
  xss_title: "Core-Level XSS Sanitization"
  xss_text_html: "Per Manifesto Law 5.3, every rich-text value destined for the database is sterilized at the core level via <code>RichTextSanitizer</code>."
  seo_title: "Dynamic Semantic SEO"
  seo_text_html: "Automatic JSON-LD (Schema.org) generation (BlogPosting, WebPage) from hybrid JSON-based data through <code>SchemaOrgBuilder</code>."
  event_title: "Autonomous Event-Driven Topology"
  event_text: "A reactive messaging backbone built without violating YAGNI — asynchronous and decoupling-focused. Cross-layer dependencies and hook triggers (event subscribers) are minimized with \"Golden Ratio\" precision."


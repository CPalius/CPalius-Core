about:
  label: "Why CPalius?"
  title: "Theory, Practice, and the Pain of Reinventing the Wheel"
  desc: "Every modern web project starts on a double-edged sword. CPalius was built to close the gap between these two worlds."
  problems_title: "Current Challenges"
  problem_cms_title: "Classic CMS Platforms (WordPress, Drupal)"
  problem_cms_text: "Packed with plugins and themes, yet burdened by cumbersome database schemas, mountains of technical debt, and security weaknesses."
  problem_fw_title: "Pure Frameworks (Symfony, Laravel)"
  problem_fw_text: "An approach that wastes time by rebuilding core components such as authentication, ACL, file management, and admin panels for every project."
  problem_mvc_title: "The Romance of Building MVC from Scratch"
  problem_mvc_text: "Writing your own framework may sound romantic, but it hides a massive iceberg of security (CSRF, XSS, SQLi), dependency injection, and HTTP-layer concerns."
  solution_title: "The CPalius Solution"
  sol_infra_title: "World-Class Foundation"
  sol_infra_text: "An architecture built on Symfony 7.4 LTS's proven security and performance foundation, free from technical debt."
  sol_components_title: "Ready-Made Enterprise Components"
  sol_components_text: "Core components such as authentication, ACL, file management, localization, and an admin panel are included from day one. No more reinventing the wheel."
  sol_modular_title: "Modular and Extensible"
  sol_modular_text: "More than a CMS: an application platform for car dealerships, travel agencies, CRM, and ERP systems — all running on the same foundation."
  sol_core_title: "An Unbreakable Core"
  sol_core_text: "Errors from user modules never bring down the system. Four layers of active defense and quarantine keep the core running."


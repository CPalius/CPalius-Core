roadmap:
  label: "Roadmap"
  title: "Future Roadmap"
  desc: "Safe Mode, origin cache, telemetry, and the audit log have shipped. Sprint detail and remaining work live in the Whitepaper and the Roadmap page."
  sprint1: "Sprint 1"
  sprint1_title: "Workflow & State Machine"
  sprint1_text_html: "A mechanism that manages transitions for business records such as invoices, vehicles, and reservations (draft → preparation → sold) through YAML definitions and connects each transition to an automatic audit log. The <code class=\"code-inline\">CpResource::$workflow</code> field is already declared — the next step is wiring the real transition/guard engine."
  sprint2: "Sprint 2 — Done"
  sprint2_title: "On-Demand Image Pipeline"
  sprint2_text_html: "Shipped. <code class=\"code-inline\">ImageProcessor</code> (GD) resizes/crops on demand and caches under <code class=\"code-inline\">public/uploads/cache/</code>; the <code class=\"code-inline\">cp_thumb</code> Twig filter exposes it to every theme."
  sprint3: "Sprint 3 — Done"
  sprint3_title: "#[CpResource] Audit Log"
  sprint3_text_html: "Shipped. The <code class=\"code-inline\">cp_audit_logs</code> table and an isolated <code class=\"code-inline\">onFlush</code>/<code class=\"code-inline\">postFlush</code> listener record every create/update/delete of an auditable entity. Marking any entity <code class=\"code-inline\">#[Auditable]</code> switches it on."
  sprint4: "Sprint 4"
  sprint4_title: "Messenger Async Queue"
  sprint4_text_html: "<code class=\"code-inline\">symfony/messenger</code> is installed and visible in the AACP System Monitor; the next step is wiring a real transport (Doctrine/Redis) and moving email and notification work onto an asynchronous queue."


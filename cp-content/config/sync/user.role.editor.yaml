role:
    id: editor
    label: 'role.label.editor'
    capabilities:
        # Studio /admin landing; not admin.access (that also opens homepage settings).
        - admin.dashboard.view
        - node.post.view.own
        - node.post.create
        - node.post.edit.own
        - node.post.delete.own
        - node.post.publish
        - node.page.view.own
        - node.page.create
        - node.page.edit.own
        - node.page.delete.own
        - node.page.publish
        - pages.field_group.manage
        - blog.comment.moderate
        - forum.view
        - forum.topic.create
        - forum.thread.create
        # Unscoped forum.post.edit is not granted; moderating others needs .any.
        - forum.post.edit.own
        - forum.post.delete.own
        - forum.post.report
        - forum.post.like
        - forum.reputation.give
        - account.profile.edit
        - account.avatar.upload
        - media.view
        - media.upload
        - text_format.restricted.use
        - text_format.basic_html.use
        - text_format.full_html.use
        - text_format.markdown.use
        # Added by the Showcase module installer.
        - showcase.item.create
        - showcase.item.view.own
        - showcase.item.view.any
        - showcase.item.edit.own
        - showcase.item.edit.any
        - showcase.item.delete.own
        - showcase.item.delete.any
        - showcase.item.publish
        - showcase.item.moderate
        - showcase.review.create
        - showcase.review.moderate
        # Added by the Messages module installer.
        - messages.send
        - messages.report
        - messages.block
        - messages.moderate
        - messages.report.moderate
        - messages.settings.manage
        - messages.quota.exempt

# CPalius rol config'i — DB'de DEĞİL, burada (cp-content/config/sync/)
# versiyon kontrolüne dahil, ortamlar arası taşınabilir bir dosyada yaşar.
# Dosya adı kuralı: user.role.<id>.yaml — <id>, User::$roles içindeki
# kimlikle birebir eşleşmelidir (bkz. RoleConfigManager).
role:
    id: admin
    label: 'Yönetici'
    # '*' özel joker: registry'de kayıtlı TÜM yeteneklere sahip olur
    # (system.developer, system.module.manage, admin.access,
    # node.post.create, node.post.edit.any dahil — bkz.
    # cp-core/config/capabilities.yaml). Yine de CapabilityRegistry::has()
    # üzerinden fail-safe doğrulanır; registry boşsa veya bir yetenek
    # silinmişse otomatik olarak düşer.
    capabilities:
        - '*'

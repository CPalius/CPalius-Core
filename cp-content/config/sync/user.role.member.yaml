# CPalius role config — NOT in the DB; lives here (cp-content/config/sync/) for VCS and portability.
# File naming: user.role.<id>.yaml — <id> must match User::$roles (see RoleConfigManager).
#
# "member": default role for registered forum/site users (AccountController::DEFAULT_ROLE).
# Unlike "editor", it excludes node.post.* — registration must not grant content management; only registered-member forum capabilities.

role:
    id: member
    label: 'role.label.member'
    capabilities:
        - forum.view
        - forum.topic.create
        - forum.thread.create
        - forum.post.edit
        - forum.post.edit.own
        - forum.post.delete.own
        - forum.post.report
        - forum.post.like
        - forum.reputation.give
        - account.profile.edit
        - account.avatar.upload
        - text_format.restricted.use

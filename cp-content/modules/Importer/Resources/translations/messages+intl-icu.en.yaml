        help: 'Upload a .xml (WordPress WXR), a .sql dump, or a .zip of the files. WordPress wants wp-content/uploads; XenForo wants data/ (plus internal_data if you have it); MyBB wants uploads/. Choose XML or SQL below and the matching fields open.'
        privacy: 'Uploaded exports are stored outside the public web root and are never served. They hold the old site''s addresses and private content, so delete them once the import is finished.'
        submit: 'Upload'
        pick: 'Choose an uploaded file…'
        none: 'No file was chosen.'
        stored: '"{name}" was uploaded.'
        unpacked: '"{name}" was uploaded and unpacked.'

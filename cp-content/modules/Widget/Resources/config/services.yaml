services:
    _defaults:
        autowire: true
        autoconfigure: true

    Modules\Widget\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']

    Modules\Widget\Repository\:
        resource: '../../Repository/'

    Modules\Widget\Service\:
        resource: '../../Service/'

    # Type/ holds the general widget types (WidgetTypeInterface autoconfigure tag).
    Modules\Widget\Type\:
        resource: '../../Type/'

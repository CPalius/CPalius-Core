dnstools.spam.faq.q1: "Mail spam skoru nasıl ölçülür?"
dnstools.spam.faq.a1: "Sayfanın verdiği tek kullanımlık adrese bir ileti gönderin. SPF, DKIM, DMARC, PTR ve kara liste sonucu 10 üzerinden skorlanır."
dnstools.spam.faq.q2: "Skor düşükse ne yapmalıyım?"
dnstools.spam.faq.a2: "Sonuçtaki öneriler eksik kaydı söyler. Önce SPF ve DKIM geçsin, sonra DMARC ekleyin ve gönderen IP’nin kara listede olmadığını kontrol edin."
dnstools.spam.faq.q3: "Bu test posta gönderir mi?"
dnstools.spam.faq.a3: "Hayır. Yalnızca sizin gönderdiğiniz iletiyi okur ve skorlar. Dışarıya posta yollamaz."
dnstools.spam.advice.spf_missing.title: "SPF kaydı yok"
dnstools.spam.advice.spf_missing.text: "Gönderen alan adına bir TXT kaydı ekleyin: v=spf1 include:gönderen-sunucu -all. Kaydı olmayan postalar sık sık spam klasörüne düşer."
dnstools.spam.advice.spf_fail.title: "SPF geçmedi"
dnstools.spam.advice.spf_fail.text: "DNS’te SPF var ama bu ileti o kayda uymuyor. Postayı çıkaran sunucunun adresini SPF içine include edin."
dnstools.spam.advice.spf_present.title: "SPF kaydı var, geçiş doğrulanmadı"
dnstools.spam.advice.spf_present.text: "Alan adında SPF kaydı duruyor fakat iletide spf=pass sonucu yok. Gönderen sunucunun Authentication-Results başlığına SPF sonucunu yazması gerekir."
dnstools.spam.advice.spf_pass.title: "SPF geçti"
dnstools.spam.advice.spf_pass.text: "Gönderen sunucu SPF kaydınızla eşleşiyor. Bu kaydı bozmadan bırakın."
dnstools.spam.advice.dkim_missing.title: "DKIM imzası yok"
dnstools.spam.advice.dkim_missing.text: "Posta sunucunuzda DKIM açın ve seçici için TXT kaydını DNS’e yayın. İmzasız postanın skoru düşer."
dnstools.spam.advice.dkim_fail.title: "DKIM geçmedi"
dnstools.spam.advice.dkim_fail.text: "İmza var ama doğrulanmadı. Seçici adı, genel anahtar ve imzalanan başlıklar gönderen sunucudaki kayıtla aynı olmalı."

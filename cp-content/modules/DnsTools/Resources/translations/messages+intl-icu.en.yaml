dnstools.tool.dns-lookup.title: "DNS Lookup"
dnstools.tool.dns-lookup.subtitle: "Full record set for a domain"
dnstools.tool.dns-lookup.description: "Query A, AAAA, MX, NS, TXT, SPF, DMARC, DKIM, SOA, SRV and PTR records for any public domain."
dnstools.tool.dns-lookup.keywords: "DNS lookup, DNS records, A record, MX record, NS lookup"

dnstools.tool.mx-lookup.title: "MX Lookup"
dnstools.tool.mx-lookup.subtitle: "Mail exchange records"
dnstools.tool.mx-lookup.description: "List MX hosts and priorities so you can see where a domain receives mail."
dnstools.tool.mx-lookup.keywords: "MX lookup, mail exchanger, SMTP host"

dnstools.tool.cname-lookup.title: "CNAME Lookup"
dnstools.tool.cname-lookup.subtitle: "Alias records"
dnstools.tool.cname-lookup.description: "Resolve CNAME records on the apex and www host."
dnstools.tool.cname-lookup.keywords: "CNAME lookup, alias record, www CNAME"

dnstools.tool.ns-lookup.title: "NS Lookup"
dnstools.tool.ns-lookup.subtitle: "Authoritative nameservers"
dnstools.tool.ns-lookup.description: "Show nameservers and the IPv4/IPv6 addresses glued to them."
dnstools.tool.ns-lookup.keywords: "NS lookup, nameserver, glue records"

dnstools.tool.txt-lookup.title: "TXT Lookup"
dnstools.tool.txt-lookup.subtitle: "Text records"
dnstools.tool.txt-lookup.description: "Read TXT records used for SPF, domain verification and custom policies."
dnstools.tool.txt-lookup.keywords: "TXT lookup, SPF TXT, domain verification"

dnstools.tool.aaaa-lookup.title: "AAAA Lookup"
dnstools.tool.aaaa-lookup.subtitle: "IPv6 address records"
dnstools.tool.aaaa-lookup.description: "Check whether a domain publishes IPv6 AAAA records."
dnstools.tool.aaaa-lookup.keywords: "AAAA lookup, IPv6 DNS"

dnstools.tool.reverse-dns.title: "Reverse DNS"
dnstools.tool.reverse-dns.subtitle: "PTR from an IP"
dnstools.tool.reverse-dns.description: "Resolve the PTR hostname attached to a public IPv4 or IPv6 address."
dnstools.tool.reverse-dns.keywords: "reverse DNS, PTR lookup"

dnstools.tool.bulk-dns.title: "Bulk DNS Lookup"
dnstools.tool.bulk-dns.subtitle: "Several domains at once"
dnstools.tool.bulk-dns.description: "Query A, MX and NS records for a short allow-listed batch of domains."
dnstools.tool.bulk-dns.keywords: "bulk DNS, multiple domain lookup"

dnstools.tool.subdomain-finder.title: "Subdomain Finder"
dnstools.tool.subdomain-finder.subtitle: "Common hostname prefixes"
dnstools.tool.subdomain-finder.description: "Check a fixed list of common subdomains. This is not an open-ended brute-force enumerator."
dnstools.tool.subdomain-finder.keywords: "subdomain finder, www mail api"

dnstools.tool.dns-compare.title: "DNS Compare"
dnstools.tool.dns-compare.subtitle: "Diff two domains"
dnstools.tool.dns-compare.description: "Compare A, AAAA, MX, NS, TXT, SPF and DMARC between two public domains."
dnstools.tool.dns-compare.keywords: "DNS compare, DNS diff"

dnstools.tool.dnssec.title: "DNSSEC Validator"
dnstools.tool.dnssec.subtitle: "DS and DNSKEY presence"
dnstools.tool.dnssec.description: "Check whether DNSSEC material is published for a domain."
dnstools.tool.dnssec.keywords: "DNSSEC, DS record, DNSKEY"

dnstools.tool.dns-leak.title: "DNS Leak Test"
dnstools.tool.dns-leak.subtitle: "Client IP as seen by this host"
dnstools.tool.dns-leak.description: "Shows the public address this site received and its PTR. A true browser leak test needs a client-side resolver."
dnstools.tool.dns-leak.keywords: "DNS leak test, resolver IP"

dnstools.tool.zone-transfer.title: "Zone Transfer Test"
dnstools.tool.zone-transfer.subtitle: "AXFR exposure check"
dnstools.tool.zone-transfer.description: "Tests whether nameservers accept TCP/53. Zone contents are never returned."
dnstools.tool.zone-transfer.keywords: "AXFR, zone transfer test"

dnstools.tool.spf-checker.title: "SPF Checker"
dnstools.tool.spf-checker.subtitle: "Sender Policy Framework"
dnstools.tool.spf-checker.description: "Read and display the SPF TXT policy of a domain."
dnstools.tool.spf-checker.keywords: "SPF checker, v=spf1"

dnstools.tool.dmarc-checker.title: "DMARC Checker"
dnstools.tool.dmarc-checker.subtitle: "_dmarc TXT policy"
dnstools.tool.dmarc-checker.description: "Inspect the DMARC record published at _dmarc.example.com."
dnstools.tool.dmarc-checker.keywords: "DMARC checker, p=reject"

dnstools.tool.dkim-checker.title: "DKIM Checker"
dnstools.tool.dkim-checker.subtitle: "Selector public key"
dnstools.tool.dkim-checker.description: "Look up selector._domainkey TXT records used for DKIM."
dnstools.tool.dkim-checker.keywords: "DKIM checker, domainkey"

dnstools.tool.bimi-checker.title: "BIMI Checker"
dnstools.tool.bimi-checker.subtitle: "Brand logo for inbox"
dnstools.tool.bimi-checker.description: "Read default._bimi TXT, require an HTTPS SVG location and optionally probe the logo URL."
dnstools.tool.bimi-checker.keywords: "BIMI checker, brand indicators for message identification"

dnstools.tool.mta-sts-checker.title: "MTA-STS Checker"
dnstools.tool.mta-sts-checker.subtitle: "Forced TLS between mail servers"
dnstools.tool.mta-sts-checker.description: "Inspect _mta-sts TXT and fetch https://mta-sts.example.com/.well-known/mta-sts.txt."
dnstools.tool.mta-sts-checker.keywords: "MTA-STS checker, mail TLS policy"

dnstools.tool.tls-rpt-checker.title: "TLS-RPT Checker"
dnstools.tool.tls-rpt-checker.subtitle: "TLS reporting mailbox"
dnstools.tool.tls-rpt-checker.description: "Read the _smtp._tls TXT record used for SMTP TLS reporting (TLS-RPT)."
dnstools.tool.tls-rpt-checker.keywords: "TLS-RPT checker, rua mailto"

dnstools.tool.dns-cache.title: "DNS Cache Check"
dnstools.tool.dns-cache.subtitle: "TTL and SOA"
dnstools.tool.dns-cache.description: "Show TTL values and SOA timers that control how long resolvers cache answers."
dnstools.tool.dns-cache.keywords: "DNS TTL, SOA, cache"

dnstools.tool.dns-response-time.title: "DNS Response Time"
dnstools.tool.dns-response-time.subtitle: "Local resolver timing"
dnstools.tool.dns-response-time.description: "Measure how long this server takes to resolve A records."
dnstools.tool.dns-response-time.keywords: "DNS response time, latency"

dnstools.tool.dns-speed.title: "DNS Speed Test"
dnstools.tool.dns-speed.subtitle: "Public DoH resolvers"
dnstools.tool.dns-speed.description: "Compare Cloudflare, Google, Quad9 and OpenDNS over DNS-over-HTTPS."
dnstools.tool.dns-speed.keywords: "DNS speed test, DoH"

dnstools.tool.dns-propagation.title: "DNS Propagation"
dnstools.tool.dns-propagation.subtitle: "Worldwide resolver view"
dnstools.tool.dns-propagation.description: "Ask several public resolvers for the same A record and compare answers."
dnstools.tool.dns-propagation.keywords: "DNS propagation, resolver comparison"

dnstools.tool.dns-generator.title: "DNS Generator"
dnstools.tool.dns-generator.subtitle: "BIND and Cloudflare output"
dnstools.tool.dns-generator.description: "Build A, AAAA, MX, NS, TXT, SPF, DKIM and DMARC records and export BIND or CSV."
dnstools.tool.dns-generator.keywords: "DNS generator, zone file, Cloudflare CSV"

dnstools.tool.dmarc-generator.title: "DMARC Generator"
dnstools.tool.dmarc-generator.subtitle: "Policy builder"
dnstools.tool.dmarc-generator.description: "Create a DMARC TXT value with policy and optional rua mailbox."
dnstools.tool.dmarc-generator.keywords: "DMARC generator, rua"

dnstools.tool.dkim-generator.title: "DKIM Generator"
dnstools.tool.dkim-generator.subtitle: "TXT host helper"
dnstools.tool.dkim-generator.description: "Format a DKIM public key as a selector._domainkey TXT record."
dnstools.tool.dkim-generator.keywords: "DKIM generator, domainkey TXT"

dnstools.tool.bimi-generator.title: "BIMI Generator"
dnstools.tool.bimi-generator.subtitle: "TXT builder"
dnstools.tool.bimi-generator.description: "Build a default._bimi TXT record from an HTTPS logo URL and optional VMC certificate URL."
dnstools.tool.bimi-generator.keywords: "BIMI generator, VMC"

dnstools.tool.domain-analysis.title: "Domain Analysis"
dnstools.tool.domain-analysis.subtitle: "DNS, WHOIS and reputation"
dnstools.tool.domain-analysis.description: "Combine DNS health, registration dates and IPv4 blacklist status into one score."
dnstools.tool.domain-analysis.keywords: "domain analysis, domain score"

dnstools.tool.domain-age.title: "Domain Age"
dnstools.tool.domain-age.subtitle: "Creation date"
dnstools.tool.domain-age.description: "Read the WHOIS creation date and compute domain age."
dnstools.tool.domain-age.keywords: "domain age calculator"

dnstools.tool.domain-expiry.title: "Domain Expiry"
dnstools.tool.domain-expiry.subtitle: "Days remaining"
dnstools.tool.domain-expiry.description: "Show registrar expiry date and remaining days from WHOIS."
dnstools.tool.domain-expiry.keywords: "domain expiry checker"

dnstools.tool.whois.title: "WHOIS"
dnstools.tool.whois.subtitle: "Registration record"
dnstools.tool.whois.description: "Query IANA and TLD WHOIS servers over port 43. No shell commands are used."
dnstools.tool.whois.keywords: "WHOIS lookup, registrar, nameservers"

dnstools.tool.domain-history.title: "Domain History"
dnstools.tool.domain-history.subtitle: "Current snapshot"
dnstools.tool.domain-history.description: "Show the current WHOIS and DNS snapshot. Historical third-party archives are not fetched."
dnstools.tool.domain-history.keywords: "domain history, WHOIS snapshot"

dnstools.tool.smtp-tester.title: "SMTP Tester"
dnstools.tool.smtp-tester.subtitle: "Banner and port reachability"
dnstools.tool.smtp-tester.description: "Connect to MX hosts on 25/465/587 and read banners. Mail is never sent."
dnstools.tool.smtp-tester.keywords: "SMTP tester, mail port"

dnstools.tool.email-header.title: "Email Header Analyzer"
dnstools.tool.email-header.subtitle: "Paste a raw header"
dnstools.tool.email-header.description: "Parse Received, From, Authentication-Results and related fields from pasted headers."
dnstools.tool.email-header.keywords: "email header analyzer, received chain"

dnstools.tool.email-security.title: "Email Security Check"
dnstools.tool.email-security.subtitle: "MX plus SPF/DKIM/DMARC"
dnstools.tool.email-security.description: "Inspect the domain side of an address: MX, SPF, DKIM, DMARC and MX IP lists."
dnstools.tool.email-security.keywords: "email security, SPF DKIM DMARC"

dnstools.tool.spam-score.title: "Mail spam score"
dnstools.tool.spam-score.subtitle: "Send to a random address or paste the source"
dnstools.tool.spam-score.description: "Each run issues a one-shot address on the catch-all domain. Mail sent there, or a pasted source, is scored 0–10 from SPF/DKIM/DMARC, PTR and blacklists. Mail is never sent outbound."
dnstools.tool.spam-score.keywords: "mail spam score, mail tester, email score"

dnstools.tool.email-deliverability.title: "Email deliverability"
dnstools.tool.email-deliverability.subtitle: "MX, SPF, DKIM, DMARC and PTR"
dnstools.tool.email-deliverability.description: "Score the domain side of an address without receiving a message: MX, SPF, DKIM, DMARC, PTR and the MX IP blacklist."
dnstools.tool.email-deliverability.keywords: "email deliverability, MX PTR"


studio.ai.quickstart.title: "Quick start"
studio.ai.quickstart.lead: "A Gemini or Groq key improves quality. If the key is missing or Gemini returns 402, translation continues on the free fallback. The key stays on this server and is never committed."
studio.ai.quickstart.step1: "Create an API key in AI Studio (Gemini) or console.groq.com and paste it in the card below."
studio.ai.quickstart.step2: "Keep a free model: Gemini 3.5 Flash-Lite or Groq Llama 3.1 8B. Lite models on a billed Gemini project at $0 prepaid still return 402."
studio.ai.quickstart.step3: "On a new forum topic, post or page, tick the box — title and body are published in the other active language."
studio.ai.quickstart.step4: "For existing content, turn on “Allow translation when editing”. The box stays hidden while it is off."
studio.ai.quickstart.step5: "Tick the box on edit. If a sibling already exists in the other language, you get a warning and no duplicate is created."
studio.ai.field.allow_edit_translate: "Allow translation when editing"
studio.ai.field.allow_edit_translate_help: "When on, the box appears on forum topic, post and page edit forms. Default is off to prevent abuse."

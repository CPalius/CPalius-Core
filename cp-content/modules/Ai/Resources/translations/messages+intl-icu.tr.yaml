studio.ai.quickstart.title: "Hızlı başlangıç"
studio.ai.quickstart.lead: "Gemini veya Groq anahtarı kaliteyi yükseltir. Anahtar yoksa veya Gemini 402 verirse çeviri ücretsiz yedekle sürer. Anahtar bu sunucuda kalır, depoya yazılmaz."
studio.ai.quickstart.step1: "AI Studio (Gemini) veya console.groq.com üzerinden bir API anahtarı alın ve aşağıdaki karta yapıştırın."
studio.ai.quickstart.step2: "Ücretsiz model bırakın: Gemini 3.5 Flash-Lite veya Groq Llama 3.1 8B. Faturalı Gemini projesinde kredi $0 ise lite da 402 verir."
studio.ai.quickstart.step3: "Yeni forum konusu, yazı veya sayfada kutuyu işaretleyin — başlık ve gövde diğer aktif dile çevrilip yayınlanır."
studio.ai.quickstart.step4: "Eski içerik için “Düzenlemede çeviriye izin ver” anahtarını açın. Kapalıyken kutu görünmez."
studio.ai.quickstart.step5: "Düzenlemede kutuyu işaretleyin. Diğer dilde kardeş kayıt varsa uyarı gelir ve ikinci bir kopya açılmaz."

twig:
    file_name_pattern: '*.twig'
    # Pristine Root: the default template dir is moved under cp-core so no
    # templates/ folder appears in the project root.
    default_path: '%kernel.project_dir%/cp-core/templates'
    paths:
        '%kernel.project_dir%/cp-core/templates': ~
        # Theme view directories are NOT listed here: ThemeTwigPathPass registers
        # every installed theme plus the shared "@Theme" namespace at compile time.
    globals:
        cp_app_name: '%env(CP_APP_NAME)%'
        # Running core version — from the CpVersion constant, not .env, so it
        # stays correct after a file-overwrite update. See CpVersion.
        cp_app_version: '%cpalius.version%'
        # cp_active_theme is registered by ThemeTwigPathPass: the parameter does
        # not exist yet when Twig extension config is merged.
    form_themes:
        # Shared flat form skeleton for every Studio form.
        - 'form/studio_flat_theme.html.twig'

when@test:
    twig:
        strict_variables: true

framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: cpalius/cmf

        # The "app" cache: genel amaçlı pool, artık dosya sistemi yerine Redis.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        # Namespaced pools use the above "app" backend by default
        pools:
            # Doctrine query/metadata/result cache — doctrine.yaml'daki
            # when@prod bloğu bu iki pool'u zaten adapter: cache.system /
            # cache.app ile referans alıyordu; burada Redis'e bağlanır.
            doctrine.result_cache_pool:
                adapter: cache.adapter.redis
            doctrine.system_cache_pool:
                adapter: cache.adapter.redis

            # Memcached: app cache'ten (Redis) AYRI, sadece HTTP
            # fragment/ESI cache için ikinci bir pool (bkz. plan — Redis
            # zaten genel cache'i karşılıyor, Memcached'e ayrı bir rol
            # verildi).
            cache.fragments:
                adapter: cache.adapter.memcached
                provider: '%env(MEMCACHED_DSN)%'

# Laragon/local: Redis & Memcached çoğu kurulumda KAPALI. Her istekte
# default TCP timeout birikip 30–60 sn "donma" yaratır. Dev'de dosya
# tabanlı adapter kullan; prod/canlı Redis URL'ini korur.
when@dev:
    framework:
        cache:
            app: cache.adapter.filesystem
            system: cache.adapter.system
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.adapter.filesystem
                doctrine.system_cache_pool:
                    adapter: cache.adapter.filesystem
                cache.fragments:
                    adapter: cache.adapter.filesystem

# FAZ 2: test ortamı, dev ile AYNI gerekçeyle harici servislerden tamamen
# koparılır — ama burada gerekçe rahatlık değil, DOĞRULUK.
#
# Bu blok olmadan test ortamı kök yapılandırmayı miras alır ve Redis
# (cache.adapter.redis) ile Memcached (cache.fragments) bağlantısı
# denemeye çalışır. CI koşucusunda bu servisler YOKTUR: sonuç, gerçek bir
# regresyonu değil yalnızca ortamın eksikliğini raporlayan, üstelik TCP
# zaman aşımı süresince asılı kalan bir test paketi olurdu.
#
# "array" adapter, "filesystem"e TERCİH EDİLİR: her test kendi süreç
# belleğinde tamamen boş bir önbellekle başlar, testler arasında disk
# üzerinden sızıntı olmaz ve temizlik gerektirmez. Testin ölçtüğü şey
# önbellek davranışının kendisiyse (ileride) o test kendi pool'unu açıkça
# kurmalıdır.
when@test:
    framework:
        cache:
            app: cache.adapter.array
            system: cache.adapter.array
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.adapter.array
                doctrine.system_cache_pool:
                    adapter: cache.adapter.array
                cache.fragments:
                    adapter: cache.adapter.array

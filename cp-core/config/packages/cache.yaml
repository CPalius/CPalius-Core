framework:
    cache:
        # MUST be unique PER INSTALLATION, not per product. This was a literal
        # "cpalius/cmf" for every site running this codebase, which means any two
        # installs sharing one Redis server (the normal case on a VPS hosting
        # several sites) compute the IDENTICAL cache key namespace and silently
        # read/write each other's cached data — SettingsRegistry's cache.app entry
        # (cpalius.settings.values, a fixed key) is what made this visible: site A's
        # homepage mode became site B's homepage mode the moment both wrote through
        # the same Redis-backed pool. APP_SECRET is generated fresh and random per
        # install (EnvironmentWriter::secret()), so it doubles as a free, correct,
        # zero-configuration namespace seed — no operator has to remember to set
        # anything, which is exactly how the previous literal went unnoticed.
        prefix_seed: '%env(APP_SECRET)%'

        # The "app" cache: general-purpose pool, Redis instead of filesystem.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        # Namespaced pools use the above "app" backend by default
        pools:
            # Doctrine query/metadata/result cache — referenced from doctrine.yaml;
            # wired to Redis here.
            doctrine.result_cache_pool:
                adapter: cache.adapter.redis
            doctrine.system_cache_pool:
                adapter: cache.adapter.redis

            # Memcached: separate from app cache (Redis), dedicated to HTTP fragment/ESI cache.
            cache.fragments:
                adapter: cache.adapter.memcached
                provider: '%env(MEMCACHED_DSN)%'

# Laragon/local: Redis & Memcached are usually off; TCP timeouts freeze requests.
# Dev uses filesystem adapters; prod keeps the Redis URL.
when@dev:
    framework:
        cache:
            app: cache.adapter.filesystem
            system: cache.adapter.system
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.adapter.filesystem
                doctrine.system_cache_pool:
                    adapter: cache.adapter.filesystem
                cache.fragments:
                    adapter: cache.adapter.filesystem
                    # Base config's Memcached DSN is a keyed value, not wholesale replaced by
                    # this block — must be cleared explicitly or AbstractAdapter::createConnection()
                    # still tries to dial Memcached underneath the filesystem adapter (T2.3 found
                    # this while wiring the first real consumer of this pool, CacheTagIndex).
                    provider: ~

# Phase 2: test env is isolated from external services (correctness, not convenience).
#
# Without this block, CI tries Redis/Memcached and hangs on TCP timeouts.
#
# "array" adapter preferred over filesystem: fresh in-memory cache per test, no disk leakage.
when@test:
    framework:
        cache:
            app: cache.adapter.array
            system: cache.adapter.array
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.adapter.array
                doctrine.system_cache_pool:
                    adapter: cache.adapter.array
                cache.fragments:
                    adapter: cache.adapter.array
                    provider: ~

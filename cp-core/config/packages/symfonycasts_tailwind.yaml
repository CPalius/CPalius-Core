symfonycasts_tailwind:
    # Pristine Root: giriş CSS dosyası cp-core/assets altında yaşar,
    # proje kökünde assets/ veya tailwind.config.js oluşmasını engeller.
    input_css:
        - '%kernel.project_dir%/cp-core/assets/styles/app.css'
    # Tailwind v4: config_file (CommonJS) kullanılmaz, tarama kaynakları
    # app.css içindeki @source direktifleriyle tanımlanır ("Zero Node.js").
    binary_version: '4.3.2'
    # Tailwind v4 config_file üretmez; yine de bundle varsayılanının proje
    # köküne düşmesini önlemek için açıkça cp-core altına sabitliyoruz.
    config_file: '%kernel.project_dir%/cp-core/tailwind.config.js'

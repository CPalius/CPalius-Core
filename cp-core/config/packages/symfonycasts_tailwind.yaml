symfonycasts_tailwind:
    # Pristine Root: entry CSS under cp-core/assets — no assets/ at project root.
    input_css:
        - '%kernel.project_dir%/cp-core/assets/styles/app.css'
    # Tailwind v4: scan sources via @source in app.css, not config_file ("Zero Node.js").
    binary_version: '4.3.2'
    # Pin config_file under cp-core so the bundle default does not land at project root.
    config_file: '%kernel.project_dir%/cp-core/tailwind.config.js'

framework:
    messenger:
        failure_transport: failed

        transports:
            # Durable Doctrine transport — shared hosting friendly (no Redis).
            # Cron (cpalius.messenger.consume) or `messenger:consume async` drains it.
            async:
                dsn: 'doctrine://default?queue_name=async'
                options:
                    # Claim rows atomically when multiple workers share a host.
                    auto_setup: false
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'App\Core\Mail\Message\SendMailMessage': async
            'App\Core\Notification\Message\SendNotificationMailMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'

# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
#
# Pimcore-style media storage layer (Pristine Root).
# Physical files go to public/uploads so the web server serves them without symlinks.
flysystem:
    storages:
        cpalius_storage:
            local:
                directory: '%kernel.project_dir%/public/uploads'

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/cp-core/src/Entity'
                prefix: 'App\Entity'
                alias: App
        # Manifesto Law 5.1: #[CpResource(multiTenant: true)] işaretli
        # entity'lerin sorgularına otomatik tenant_id kısıtı enjekte eder.
        # Etkinleştirme/parametre doldurma TenantFilterActivationListener'da.
        filters:
            tenant: App\Core\Database\TenantFilter
        # Query/result cache pool'ları her ortamda Redis'e bağlı (bkz.
        # cache.yaml: doctrine.result_cache_pool / doctrine.system_cache_pool).
        # when@prod'a özgü ayrı bir tanım yok; dev'de de Redis'in gerçek
        # davranışını görmek (health-check yanıltıcılığını önlemek) için
        # aynı pool'lar kullanılır.
        query_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
        result_cache_driver:
            type: pool
            pool: doctrine.result_cache_pool

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

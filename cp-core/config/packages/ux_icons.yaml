# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:

    # Default HTML attributes to add to all icons
    default_icon_attributes:

        # Use current text color to fill the icon
        fill: currentColor

        # Default dimensions
        height: '1em'
        width: '1em'

    # Icons are vendored in assets/icons (ux:icons:import / ux:icons:lock). Never fetch from api.iconify.design:
    # a runtime call there blocked the page on every cold cache and made the panel depend on a third party.
    iconify:
        enabled: false

    # A missing icon renders empty instead of breaking the page.
    ignore_not_found: true

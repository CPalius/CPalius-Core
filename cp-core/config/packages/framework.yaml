# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # handler_id boş bırakılırsa PHP'nin varsayılan (dosya) session
    # handler'ı kullanılır; Redis'e taşımak için cache.redis servisini
    # session handler'ı olarak veriyoruz.
    session:
        handler_id: 'session.handler.redis'
        cookie_secure: auto
        cookie_samesite: lax

    csrf_protection: true

    form: true

    # Varnish önde reverse-proxy olarak koşacağı için Symfony'nin ESI
    # (Edge Side Includes) desteği açılır — Surrogate-Capable header'ını
    # okuyup fragment'ları Varnish'e devredebilir.
    esi: true
    fragments: { path: /_fragment }

    # http_cache.enabled BİLİNÇLİ OLARAK false: Symfony'nin dahili
    # AppCache reverse-proxy'si DEĞİL, gerçek Varnish önde koşuyor. Bu
    # blok sadece response header stratejisini (terminate_on_cache_hit)
    # ayarlar — Varnish TCP bağlantısını PHP-FPM/worker beklemeden
    # kapatabilsin diye cache-hit'lerde PHP süreci erken sonlanır.
    http_cache:
        enabled: false
        terminate_on_cache_hit: true

# Redis kapalı local kurulumlarda Failover handler her session
# read/write'ta önce Redis'e bağlanmayı dener → saniyelerce bekler.
# Dev'de doğrudan native dosya session kullan.
when@dev:
    framework:
        session:
            handler_id: null

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
            # handler_id: null ZORUNLUDUR (FAZ 2'de tespit edildi).
            #
            # storage_factory_id'yi mock_file yapmak YETMİYOR: kök
            # yapılandırmadaki "handler_id: session.handler.redis" hâlâ
            # geçerli kalıyor ve FailoverRedisSessionHandler -> Redis
            # servisi container'da tanımlı olmayı sürdürüyor. Doctrine'in
            # PdoSessionHandlerSchemaListener'ı, şema işlemleri sırasında
            # session handler servisini ÇÖZÜMLÜYOR ve o anda Redis
            # bağlantısı kurulmaya çalışılıyor.
            #
            # Redis PHP eklentisi kurulu olmayan bir CI koşucusunda bu,
            # testlerle hiç ilgisi olmayan bir CacheException'a dönüşür:
            # "Cannot find the redis extension nor the relay extension".
            # when@dev bloğu aynı sorunu aynı satırla çözüyor.
            handler_id: null

monolog:
    channels:
        - deprecation
        - mail
        - security

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            cp_db:
                type: service
                id: App\Core\Logging\Monolog\DoctrineLogHandler
                level: warning
                channels: ["!event", "!doctrine"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            cp_db:
                type: service
                id: App\Core\Logging\Monolog\DoctrineLogHandler
                level: warning
                channels: ["!event", "!doctrine"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50
            nested:
                type: stream
                # php://stderr is closed under web SAPIs and the installer, which turns every log call
                # into "Bad file descriptor" and hides the real error behind it.
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/deprecation.log"
                formatter: monolog.formatter.json
            cp_db:
                type: service
                id: App\Core\Logging\Monolog\DoctrineLogHandler
                level: warning
                channels: ["!event", "!doctrine", "!deprecation"]

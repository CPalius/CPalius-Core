framework:
    default_locale: tr
    translator:
        default_path: '%kernel.project_dir%/cp-content/translations'
        fallbacks:
            - en
        paths:
            - '%kernel.project_dir%/cp-content/translations'
            # Modules are Symfony bundles — Resources/translations is auto-scanned
            # via kernel.bundles_metadata (FrameworkExtension::registerTranslatorConfiguration()).

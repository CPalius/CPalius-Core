# Core capabilities. Modules add theirs in Resources/config/capabilities.yaml
# (see CapabilityRegistrationPass), not here.
#
# node.post.* lives in Blog's capabilities.yaml, not here.
#
# Naming: <domain>.<entity>.<action>[.<scope>]
#   - system.module.manage    -> enable/disable modules from AACP
capabilities:
    - system.developer
    - system.module.manage
    - system.aacp.access
    - system.settings.manage
    - system.security.manage
    - system.queue.manage
    - system.logs.manage
    - system.performance.manage
    - system.cron.manage
    - system.backup.manage
    - system.hooks.manage
    - system.api.manage
    - system.webhooks.manage
    - system.fields.manage
    - taxonomy.manage
    - content.revision.manage
    - content.moderate
    - content.publish
    - system.users.view
    - system.users.manage
    - system.localization.manage
    - account.profile.edit
    - account.avatar.upload
    - core.url_alias.manage
    - core.path_pattern.manage
    - core.text_format.manage
    - text_format.restricted.use
    - text_format.basic_html.use
    - text_format.full_html.use
    - text_format.markdown.use
    - admin.access
